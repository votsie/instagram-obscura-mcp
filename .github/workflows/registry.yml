name: Publish official MCP Registry
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: official-mcp-registry
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'votsie/instagram-obscura-mcp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate public metadata with the official Registry
        run: |
          curl --fail --silent --show-error --json @server.json https://registry.modelcontextprotocol.io/v0.1/validate -o "$RUNNER_TEMP/registry-validation.json"
          python3 -c 'import json,os,pathlib; r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"registry-validation.json").read_text()); print(r); assert r["valid"] is True'
      - name: Download a pinned publisher with verified integrity
        shell: bash
        run: |
          if ! command -v aria2c >/dev/null; then sudo apt-get install -y aria2; fi
          dir="$RUNNER_TEMP/mcp-publisher"
          mkdir -p "$dir"
          aria2c --no-conf=true --max-connection-per-server=16 --split=16 --min-split-size=1M --summary-interval=0 --dir="$dir" --out=publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.9/mcp-publisher_linux_amd64.tar.gz
          test "$(stat -c %s "$dir/publisher.tar.gz")" -eq 7707000
          echo "4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8  $dir/publisher.tar.gz" | sha256sum --check --strict
          tar -xzf "$dir/publisher.tar.gz" -C "$dir" mcp-publisher
          chmod +x "$dir/mcp-publisher"
      - name: Authenticate using the repository identity
        run: '"$RUNNER_TEMP/mcp-publisher/mcp-publisher" login github-oidc'
      - name: Publish custom-installation metadata
        run: '"$RUNNER_TEMP/mcp-publisher/mcp-publisher" publish'
