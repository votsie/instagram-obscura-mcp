[project]
name = "instagram-obscura-mcp"
version = "0.1.0"
description = "Local Instagram MCP server for Reels, saved posts and multilingual speech analysis"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "votsie"}]
keywords = ["instagram", "mcp", "model-context-protocol", "reels", "whisper", "obscura"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: Microsoft :: Windows", "Topic :: Multimedia :: Video"]
dependencies = ["mcp>=2.2,<3", "playwright>=1.55,<2", "websockets>=17,<18", "pywin32>=312; sys_platform == 'win32'"]

[project.optional-dependencies]
analysis = ["faster-whisper>=1.1,<2", "numpy>=1.26,<3", "huggingface-hub>=0.24,<2"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "coverage>=7,<8", "build>=1,<2"]

[project.urls]
Repository = "https://github.com/votsie/instagram-obscura-mcp"
Issues = "https://github.com/votsie/instagram-obscura-mcp/issues"

[project.scripts]
instagram-mcp = "instagram_mcp.server:main"
instagram-mcp-doctor = "instagram_mcp.doctor:main"
instagram-mcp-setup = "instagram_mcp.bootstrap:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/instagram_mcp"]

[tool.hatch.build.targets.sdist]
only-include = [
  "src", "tests", "docs", "site", "scripts", "skills", "examples", ".github",
  "pyproject.toml", "README.md", "README.ru.md", "LICENSE", "AGENTS.md", "CLAUDE.md",
  "CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md", "THIRD_PARTY_NOTICES.md",
  "llms.txt", ".gitattributes", ".gitignore", ".env.example"
]
exclude = [
  "**/graphify-out/**", "**/.work/**", "**/.venv/**", "**/.git/**",
  "**/__pycache__/**", "**/.pytest_cache/**", "**/dist/**", "**/build/**",
  "**/profile/**", "**/profiles/**", "**/jobs/**", "**/uploads/**", "**/models/**",
  "**/.env", "**/.env.local", "**/cookies*.json", "**/*storage-state*.json",
  "**/*.pyc", "**/*.pyo", "**/*.log", "**/*.mp4", "**/*.wav", "**/*.mp3", "**/*.webm",
  "**/*.exe", "**/*.dll", "**/*.bin"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
